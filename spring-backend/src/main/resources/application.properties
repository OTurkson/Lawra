spring.application.name=backend
server.address=0.0.0.0
server.port=8080

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/lawra?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# JWT Settings
jwt.secret=your-super-secret-key-that-is-at-least-256-bits-long-for-hs256
jwt.expiration-ms=86400000
  # 24 hours

# Java Mail Sender (Gmail app password via environment variables)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@lawra.local}}
app.frontend.reset-password-url-base=${RESET_PASSWORD_URL:http://localhost:5173/reset-password}